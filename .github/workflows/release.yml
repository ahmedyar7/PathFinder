name: Release

# Builds a standalone Pathfinder executable for Windows, Linux and macOS and
# attaches them to a GitHub Release.
#
#   Automatic : push a tag that starts with "v"  ->  git tag v1.0.0 && git push origin v1.0.0
#   Manual    : Actions -> Release -> "Run workflow", then type the tag to publish.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (e.g. v1.0.0)'
        required: true
        type: string

# Needed so the release job can create the release and upload the binaries.
permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            asset: PathFinder-windows-x64.exe
          # 22.04 rather than latest: binaries built against an older glibc
          # still run on newer distributions, but not the other way round.
          - os: ubuntu-22.04
            label: linux-x64
            asset: PathFinder-linux-x64
          - os: macos-13          # Intel Macs
            label: macos-x64
            asset: PathFinder-macos-x64.zip
          - os: macos-latest      # Apple Silicon
            label: macos-arm64
            asset: PathFinder-macos-arm64.zip

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # newest version with wheels for every OS here
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name PathFinder main.py

      # A bundle that is missing a shared library dies immediately, so a run
      # that is still alive after 10s (exit code 124) is a healthy one.
      - name: Smoke-test the binary (Linux)
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          chmod +x dist/PathFinder
          set +e
          timeout 10s ./dist/PathFinder
          code=$?
          set -e
          if [ "$code" -ne 124 ]; then
            echo "::error::PathFinder exited early with code $code"
            exit 1
          fi
          echo "Binary started and kept running."

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/PathFinder.exe "${{ matrix.asset }}"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/PathFinder
          mv dist/PathFinder "${{ matrix.asset }}"

      # macOS gets the .app bundle, zipped with ditto so the bundle structure
      # and any signing metadata survive the round trip.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/PathFinder.app "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download every build
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lh dist

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing its assets."
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Pathfinder Visualizer $TAG" \
              --generate-notes
          fi
